name: Fork PR CI

on:
  pull_request:
    branches:
      - dev
      - thep2p-dev
    paths:
      - "crates/**"
      - "examples/**"
      - "Cargo.toml"
      - ".github/workflows/**"
  push:
    branches:
      - thep2p/ci  # Add push trigger for testing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools, rustc-dev

      - name: Install nightly for formatting
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run cargo fmt
        run: cargo +nightly fmt --all -- --check

      # Run clippy excluding packages that require SP1 toolchain
      - name: Run cargo clippy
        run: |
          cargo clippy \
            --workspace \
            --all-features \
            --lib --bins \
            --exclude test-artifacts \
            --exclude sp1-verifier \
            --exclude sp1-perf \
            --exclude sp1-build \
            -- -D warnings -A incomplete-features
        env:
          CARGO_INCREMENTAL: 1

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature-flags:
          - "--no-default-features"
          - ""  # default features
          - "--all-features"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools, rustc-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.feature-flags }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Run check excluding packages that need SP1 toolchain
      - name: Run cargo check
        run: |
          cargo check \
            --workspace \
            --lib --bins \
            --exclude test-artifacts \
            --exclude sp1-verifier \
            --exclude sp1-perf \
            --exclude sp1-build \
            ${{ matrix.feature-flags }}

  check-verifier-no-std:
    name: Check Verifier no_std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check verifier no_std build
        run: cargo check --target riscv32imac-unknown-none-elf --no-default-features -p sp1-verifier

  examples-format:
    name: Examples Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install nightly for formatting
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format examples
        run: |
          cd examples
          cargo +nightly fmt --all -- --check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools, rustc-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Run unit tests only (no integration tests) excluding packages that need SP1 toolchain
      - name: Run unit tests
        run: |
          cargo test \
            --lib \
            --workspace \
            --exclude test-artifacts \
            --exclude sp1-verifier \
            --exclude sp1-eval \
            --exclude sp1-perf \
            --exclude sp1-build
        env:
          RUST_BACKTRACE: 1
          SP1_DEV: 1
